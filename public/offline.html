<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · UVU</title>
<style>
  :root { color-scheme: light dark; --bg:#fffef9; --text:#1a1612; --muted:#6b6354; --gold:#8a6a1f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0a0908; --text:#f5f1e8; --muted:#8e8578; --gold:#f5d76e; } }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif; text-align:center; padding:24px; }
  h1 { font-size:28px; font-weight:800; margin:0 0 8px; letter-spacing:-0.6px; }
  p { color:var(--muted); margin:0 0 20px; }
  button { font:inherit; font-weight:700; padding:12px 20px; border-radius:12px; border:1px solid var(--gold); color:var(--gold); background:transparent; cursor:pointer; }
</style>
</head>
<body>
  <main>
    <h1>You&rsquo;re offline</h1>
    <p>UVU needs a connection to save your check-ins. Reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </main>
</body>
</html>
